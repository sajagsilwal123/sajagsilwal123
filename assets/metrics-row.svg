<svg width="800" height="90" viewBox="0 0 800 90" xmlns="http://www.w3.org/2000/svg">
  <style>
    .val { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #e6edf3; }
    .sub-val { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .label { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
  </style>
  
  <g transform="translate(10, 40)">
    <text x="0" y="0" class="val">1.4K+</text>
    <text x="0" y="24" class="label">contributions</text>
  </g>
  
  <g transform="translate(210, 40)">
    <text x="0" y="0" class="val">177</text>
    <text x="0" y="24" class="label">active days</text>
  </g>
  
  <g transform="translate(410, 40)">
    <text x="0" y="0" class="val">6d <tspan class="sub-val">/ 13d</tspan></text>
    <text x="0" y="24" class="label">current / longest streak</text>
  </g>
  
  <g transform="translate(610, 40)">
    <text x="0" y="0" class="val">24</text>
    <text x="0" y="24" class="label">repositories</text>
    <text x="0" y="44" class="sub">17 public · 7 private</text>
  </g>
</svg>