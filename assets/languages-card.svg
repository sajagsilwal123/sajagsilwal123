<svg width="380" height="180" viewBox="0 0 380 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #e6edf3; }
    .text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #e6edf3; }
    rect.bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6; }
  </style>
  <rect class="bg" width="378" height="178" x="1" y="1" />
  
  <text x="25" y="35" class="title">Most Used Languages</text>
  
  
      <g transform="translate(25, 65)">
        <circle cx="5" cy="5" r="5" fill="#3572A5" />
        <text x="20" y="10" class="text">Python</text>
        <text x="330" y="10" class="text" text-anchor="end" font-weight="600">54.7%</text>
      </g>
    
      <g transform="translate(25, 90)">
        <circle cx="5" cy="5" r="5" fill="#b07219" />
        <text x="20" y="10" class="text">Java</text>
        <text x="330" y="10" class="text" text-anchor="end" font-weight="600">42.2%</text>
      </g>
    
      <g transform="translate(25, 115)">
        <circle cx="5" cy="5" r="5" fill="#f1e05a" />
        <text x="20" y="10" class="text">JavaScript</text>
        <text x="330" y="10" class="text" text-anchor="end" font-weight="600">1.8%</text>
      </g>
    
      <g transform="translate(25, 140)">
        <circle cx="5" cy="5" r="5" fill="#663399" />
        <text x="20" y="10" class="text">CSS</text>
        <text x="330" y="10" class="text" text-anchor="end" font-weight="600">0.7%</text>
      </g>
    
      <g transform="translate(25, 165)">
        <circle cx="5" cy="5" r="5" fill="#e34c26" />
        <text x="20" y="10" class="text">HTML</text>
        <text x="330" y="10" class="text" text-anchor="end" font-weight="600">0.5%</text>
      </g>
    
</svg>