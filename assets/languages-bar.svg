<svg width="800" height="65" viewBox="0 0 800 65" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lang-label { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .lang-name { font-weight: 500; fill: #e6edf3; }
    .lang-pct { fill: #8b949e; }
    .bar-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4; }
  </style>

  <!-- Container for progress bar with rounded corners -->
  <clipPath id="bar-clip">
    <rect x="10" y="14" width="780" height="8" rx="4" />
  </clipPath>

  <g clip-path="url(#bar-clip)">
    <rect x="10" y="14" width="426" height="8" fill="#3572A5" /><rect x="436" y="14" width="329" height="8" fill="#b07219" /><rect x="765" y="14" width="14" height="8" fill="#f1e05a" /><rect x="779" y="14" width="5" height="8" fill="#663399" /><rect x="784" y="14" width="4" height="8" fill="#e34c26" /><rect x="788" y="14" width="2" height="8" fill="#4F5D95" />
  </g>

  <!-- Language labels legend -->
  <g>
    
      <circle cx="14" cy="42" r="4" fill="#3572A5" />
      <text x="23" y="46" class="lang-label">
        <tspan class="lang-name">Python</tspan> <tspan class="lang-pct">54.6%</tspan>
      </text>
    
      <circle cx="127" cy="42" r="4" fill="#b07219" />
      <text x="136" y="46" class="lang-label">
        <tspan class="lang-name">Java</tspan> <tspan class="lang-pct">42.2%</tspan>
      </text>
    
      <circle cx="225" cy="42" r="4" fill="#f1e05a" />
      <text x="234" y="46" class="lang-label">
        <tspan class="lang-name">JavaScript</tspan> <tspan class="lang-pct">1.8%</tspan>
      </text>
    
      <circle cx="368" cy="42" r="4" fill="#663399" />
      <text x="377" y="46" class="lang-label">
        <tspan class="lang-name">CSS</tspan> <tspan class="lang-pct">0.7%</tspan>
      </text>
    
      <circle cx="458.5" cy="42" r="4" fill="#e34c26" />
      <text x="467.5" y="46" class="lang-label">
        <tspan class="lang-name">HTML</tspan> <tspan class="lang-pct">0.6%</tspan>
      </text>
    
      <circle cx="556.5" cy="42" r="4" fill="#4F5D95" />
      <text x="565.5" y="46" class="lang-label">
        <tspan class="lang-name">PHP</tspan> <tspan class="lang-pct">0.1%</tspan>
      </text>
    
  </g>
</svg>