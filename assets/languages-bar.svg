<svg width="800" height="65" viewBox="0 0 800 65" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lang-label { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .lang-name { font-weight: 500; fill: #e6edf3; }
    .lang-pct { fill: #8b949e; }
    .bar-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4; }
  </style>

  <!-- Container for progress bar with rounded corners -->
  <clipPath id="bar-clip">
    <rect x="10" y="14" width="780" height="8" rx="4" />
  </clipPath>

  <g clip-path="url(#bar-clip)">
    <rect x="10" y="14" width="236" height="8" fill="#3572A5" /><rect x="246" y="14" width="199" height="8" fill="#b07219" /><rect x="445" y="14" width="157" height="8" fill="#3178c6" /><rect x="602" y="14" width="110" height="8" fill="#f1e05a" /><rect x="712" y="14" width="47" height="8" fill="#563d7c" /><rect x="759" y="14" width="31" height="8" fill="#e34c26" />
  </g>

  <!-- Language labels legend -->
  <g>
    
      <circle cx="14" cy="42" r="4" fill="#3572A5" />
      <text x="23" y="46" class="lang-label">
        <tspan class="lang-name">Python</tspan> <tspan class="lang-pct">30.2%</tspan>
      </text>
    
      <circle cx="127" cy="42" r="4" fill="#b07219" />
      <text x="136" y="46" class="lang-label">
        <tspan class="lang-name">Java</tspan> <tspan class="lang-pct">25.5%</tspan>
      </text>
    
      <circle cx="225" cy="42" r="4" fill="#3178c6" />
      <text x="234" y="46" class="lang-label">
        <tspan class="lang-name">TypeScript</tspan> <tspan class="lang-pct">20.1%</tspan>
      </text>
    
      <circle cx="368" cy="42" r="4" fill="#f1e05a" />
      <text x="377" y="46" class="lang-label">
        <tspan class="lang-name">JavaScript</tspan> <tspan class="lang-pct">14.1%</tspan>
      </text>
    
      <circle cx="511" cy="42" r="4" fill="#563d7c" />
      <text x="520" y="46" class="lang-label">
        <tspan class="lang-name">CSS</tspan> <tspan class="lang-pct">6.0%</tspan>
      </text>
    
      <circle cx="601.5" cy="42" r="4" fill="#e34c26" />
      <text x="610.5" y="46" class="lang-label">
        <tspan class="lang-name">HTML</tspan> <tspan class="lang-pct">4.0%</tspan>
      </text>
    
  </g>
</svg>