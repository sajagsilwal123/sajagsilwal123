<svg width="800" height="65" viewBox="0 0 800 65" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lang-label { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .lang-name { font-weight: 500; fill: #e6edf3; }
    .lang-pct { fill: #8b949e; }
    .bar-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4; }
  </style>

  <!-- Container for progress bar with rounded corners -->
  <clipPath id="bar-clip">
    <rect x="10" y="14" width="780" height="8" rx="4" />
  </clipPath>

  <g clip-path="url(#bar-clip)">
    <rect x="10" y="14" width="751" height="8" fill="#3572A5" /><rect x="761" y="14" width="16" height="8" fill="#f1e05a" /><rect x="777" y="14" width="8" height="8" fill="#e34c26" /><rect x="785" y="14" width="4" height="8" fill="#663399" /><rect x="789" y="14" width="2" height="8" fill="#ecdebe" /><rect x="791" y="14" width="2" height="8" fill="#012456" />
  </g>

  <!-- Language labels legend -->
  <g>
    
      <circle cx="14" cy="42" r="4" fill="#3572A5" />
      <text x="23" y="46" class="lang-label">
        <tspan class="lang-name">Python</tspan> <tspan class="lang-pct">96.2%</tspan>
      </text>
    
      <circle cx="127" cy="42" r="4" fill="#f1e05a" />
      <text x="136" y="46" class="lang-label">
        <tspan class="lang-name">JavaScript</tspan> <tspan class="lang-pct">2.0%</tspan>
      </text>
    
      <circle cx="270" cy="42" r="4" fill="#e34c26" />
      <text x="279" y="46" class="lang-label">
        <tspan class="lang-name">HTML</tspan> <tspan class="lang-pct">1.0%</tspan>
      </text>
    
      <circle cx="368" cy="42" r="4" fill="#663399" />
      <text x="377" y="46" class="lang-label">
        <tspan class="lang-name">CSS</tspan> <tspan class="lang-pct">0.5%</tspan>
      </text>
    
      <circle cx="458.5" cy="42" r="4" fill="#ecdebe" />
      <text x="467.5" y="46" class="lang-label">
        <tspan class="lang-name">Roff</tspan> <tspan class="lang-pct">0.1%</tspan>
      </text>
    
      <circle cx="556.5" cy="42" r="4" fill="#012456" />
      <text x="565.5" y="46" class="lang-label">
        <tspan class="lang-name">PowerShell</tspan> <tspan class="lang-pct">0.0%</tspan>
      </text>
    
  </g>
</svg>