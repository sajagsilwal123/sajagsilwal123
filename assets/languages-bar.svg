<svg width="800" height="65" viewBox="0 0 800 65" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lang-label { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; fill: #8b949e; }
    .lang-name { font-weight: 500; fill: #e6edf3; }
    .lang-pct { fill: #8b949e; }
    .bar-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 4; }
  </style>

  <!-- Container for progress bar with rounded corners -->
  <clipPath id="bar-clip">
    <rect x="10" y="14" width="780" height="8" rx="4" />
  </clipPath>

  <g clip-path="url(#bar-clip)">
    <rect x="10" y="14" width="321" height="8" fill="#3178c6" /><rect x="331" y="14" width="241" height="8" fill="#3572A5" /><rect x="572" y="14" width="99" height="8" fill="#61dafb" /><rect x="671" y="14" width="68" height="8" fill="#b07219" /><rect x="739" y="14" width="31" height="8" fill="#336791" /><rect x="770" y="14" width="20" height="8" fill="#89e051" />
  </g>

  <!-- Language labels legend -->
  <g>
    
      <circle cx="14" cy="42" r="4" fill="#3178c6" />
      <text x="23" y="46" class="lang-label">
        <tspan class="lang-name">TypeScript</tspan> <tspan class="lang-pct">41.2%</tspan>
      </text>
    
      <circle cx="157" cy="42" r="4" fill="#3572A5" />
      <text x="166" y="46" class="lang-label">
        <tspan class="lang-name">Python</tspan> <tspan class="lang-pct">30.9%</tspan>
      </text>
    
      <circle cx="270" cy="42" r="4" fill="#61dafb" />
      <text x="279" y="46" class="lang-label">
        <tspan class="lang-name">Next.js / React</tspan> <tspan class="lang-pct">12.7%</tspan>
      </text>
    
      <circle cx="450.5" cy="42" r="4" fill="#b07219" />
      <text x="459.5" y="46" class="lang-label">
        <tspan class="lang-name">Java</tspan> <tspan class="lang-pct">8.7%</tspan>
      </text>
    
      <circle cx="548.5" cy="42" r="4" fill="#336791" />
      <text x="557.5" y="46" class="lang-label">
        <tspan class="lang-name">PostgreSQL</tspan> <tspan class="lang-pct">4.0%</tspan>
      </text>
    
      <circle cx="691.5" cy="42" r="4" fill="#89e051" />
      <text x="700.5" y="46" class="lang-label">
        <tspan class="lang-name">Shell</tspan> <tspan class="lang-pct">2.5%</tspan>
      </text>
    
  </g>
</svg>